version: v1
# Application name (must match nova-build.yaml)
name: "staging-mcscer-jl-staging-end-to-end-verification"

# Target image (updated by build workflow in app-hub)
target: "nova-apps/staging-mcscer-jl-staging-end-to-end-verification:0.0.1-staging"

sources:
  # Application image (updated by build workflow in app-hub)
  app: "staging-mcscer-jl-staging-end-to-end-verification:0.0.1-staging"

defaults:
  # these 2 parameters will be overridden by capsule-runtime with exact values
  cpu_count: 2
  memory_mb: 4096
ingress:
  - listen_port: 8000
  - listen_port: 18001

egress:
  allow:
    - '**'
    - 0.0.0.0/0
    - ::/0


api:
  listen_port: 18000
aux_api:
  listen_port: 18001
# S3 Storage Configuration
storage:
  s3:
    enabled: false
    bucket: "nova-app-storage-prod"
    prefix: "staging/apps/mcscer/"
    region: "us-west-1"
    encryption:
      mode: "plaintext"
      key_scope: "object"
      aad_mode: "key"
      key_version: "v1"
      accept_plaintext: true


kms_integration:
  enabled: false
  use_app_wallet: false
  kms_app_id: 49
  nova_app_registry: "0x294B4AB1A242E6d477Bd4008b1507A073e83Ee9d"

