# Lab branch only: Nova's Docker -> Capsule EIF -> ECR/S3/release flow.
# No external Actions or moving tool downloads execute in this workflow.
name: Build and Publish
on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: Synthetic lab application
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      APP_DIR: ${{ inputs.app_dir }}
    steps:
      - name: Checkout exact App Hub workflow commit
        env:
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$APP_DIR" = nova-build-lab-20261008
          test "$GITHUB_REPOSITORY" = sparsity-xyz/sparsity-nova-app-hub
          test "$GITHUB_SHA" = "$WORKFLOW_COMMIT"
          git init .
          git -c credential.helper= fetch --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$WORKFLOW_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"
      - name: Fetch and hash every declared build material
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 lab/build/complete_inputs.py prepare
      - name: Build application and EIF with all external networking disabled
        run: |
          set -euo pipefail
          # The private daemon must own the canonical socket Capsule bind-mounts.
          sudo systemctl stop docker.service docker.socket containerd.service
          restore() {
            sudo chown -R "$(id -u):$(id -g)" lab/build/out
            sudo systemctl start containerd.service docker.service
          }
          trap restore EXIT
          sudo env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/root LANG=C.UTF-8 \
            unshare --net --mount --propagation private \
            python3 "$PWD/lab/build/complete_inputs.py" offline
      - name: Publish exact output and sign the complete input/output record
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/build/complete_inputs.py publish
